<div class="p-4">
    <h3 class="mb-3">Fehlendes Produkt</h3>
    <textarea class="form-control" rows="5"
        placeholder="Welches Produkt vermissen Sie? Bitte beschreiben Sie es hier..." [(ngModel)]="missingProductText">
    </textarea>
    <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-secondary me-2" (click)="dialogRef.close()">Abbrechen</button>
        <button class="btn btn-warning" (click)="submit()">Absenden</button>
    </div>
</div>
