<div class="content content-page">
    <div class="container-fluid">
        <div class="row">

            <div class="col-xl-3 col-md-4 theiaStickySidebar">
                <app-dashboard-sidebar></app-dashboard-sidebar>
            </div>


            <div class="col-xl-9 col-md-8">
                <nav class="user-tabs mb-4">
                    <ul class="nav nav-tabs nav-tabs-bottom nav-justified">
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/userprofile">Profil aktualisieren</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/deleteaccount">Dauerbestellungsbeendigung</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" routerLink="/vacation-pause">Temporäre Pause</a>
                        </li>
                    </ul>
                </nav>
                <div class="setting-content">
                    <div class="card">
                        <div class="pro-head">
                            <h3 class="pro-title without-border mb-0">Temporäre Pause</h3>
                        </div>
                        <div class="pro-body">
                            <form [formGroup]="vacationPauseForm" (ngSubmit)="vacationPause()">
                                <div class="row">
                                    <div class="form-group col-12 col-md-6 mb-3">
                                        <label class="fw-bold mb-1">Vom</label>
                                        <input type="date" class="form-control border-warning"
                                            formControlName="vacation_from" [min]="minDate"
                                            style="background-color: #fff;">
                                    </div>
                                    <div class="form-group col-12 col-md-6 mb-3">
                                        <label class="fw-bold mb-1">Bis</label>
                                        <input type="date" class="form-control border-warning"
                                            formControlName="vacation_to" [min]="minDate"
                                            style="background-color: #fff;">
                                    </div>
                                </div>
                                <div class="text-end">
                                    <button type="submit" class="btn bg-warning text-dark"
                                        [disabled]="vacationPauseForm.invalid">Pausieren</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
