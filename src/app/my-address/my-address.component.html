<div class="bread-crumb-bar">
    <div class="container">
        <div class="row align-items-center inner-banner">
            <div class="col-md-12 col-12 text-center">
                <div class="breadcrumb-list">
                    <nav aria-label="breadcrumb" class="page-breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="index.html"><img src="assets/img/home-icon.svg"
                                        alt="Post Author"> Home</a></li>
                            <li class="breadcrumb-item" aria-current="page"><a routerLink="/orders">Auftragsbestätigung</a></li>
                            <li class="breadcrumb-item" aria-current="page">Meine Adresse</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container text-dark p-5">
    <h1 class="card-title text-center mb-0">
        <i class="fa-solid fa-house"></i> Meine Adresse
    </h1><br>

    <div class="row">
        <div class="col-12 col-lg-8 col-md-8">
            <ul class="address-list">
                <li *ngFor="let address of addresses" class="address-item">
                    <div class="address-info">
                        <p class="address-content">
                            <i 
                                [ngClass]="{
                                    'fa-home': address.addressType === 'Home',
                                    'fa-building': address.addressType === 'Office',
                                    'fa-map-marker-alt': address.addressType === 'Other'
                                }" 
                                class="fa-solid address-icon">
                            </i> 
                            {{ address.addressType }}
                        </p>
                        <small class="address-details">
                            {{ address.houseNo }}, {{ address.address }}, {{ address.city }}
                        </small>
                    </div>
                    
                    <div class="button-group">
                        <button class="choose-btn" [routerLink]="['/orders']" [queryParams]="{ houseNo: address.houseNo, address: address.address, city: address.city }">
                            <i class="fa-solid fa-check"></i> Wählen
                        </button>
                        <button class="delete-btn" (click)="deleteAddress(address.id)">
                            <i class="fa-solid fa-trash"></i> Löschen
                        </button>
                    </div>
                    
                </li>
            </ul>
        
            <button class="add-btn" routerLink="/manual-address">Adresse hinzufügen</button>
        </div>
        

        <div class="col-12 col-lg-4 col-md-4 cart-calculate">
            <div class="card-footer text-center total border-0">
                <img src="/assets/img/map.png" alt="Map of Berlin" class="img-fluid map-image">
            </div>
        </div>
    </div>
</div>
