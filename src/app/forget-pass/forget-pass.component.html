<div class="login-header text-center">

    <div class="contain">
    <a href="index.html">
      <img src="assets/img/logo1.png" alt="logo" class="img-fluid">
    </a>
    <h3 style="font-size: 22px; text-align: center;">
      Passwort zurücksetzen
    </h3>
    <p class="text-success">Wer backt, gibt ein Stück seiner Liebe weiter 💖</p>
  
  
  <form [formGroup]="forgetPassForm" (ngSubmit)="onSubmit()" class="forget-pass-form">
    <!-- <div class="field">
      <input type="email" formControlName="email" placeholder="Email Address" readonly />
    </div> -->
  
    <div class="field">
      <input type="password" formControlName="newPassword" placeholder="Neues Passwort" />
      <div *ngIf="forgetPassForm.get('newPassword')?.invalid && forgetPassForm.get('newPassword')?.touched" class="error text-danger">
        Das Passwort muss mindestens 8 Zeichen, einen Großbuchstaben, eine Zahl und ein Sonderzeichen enthalten.
      </div>
    </div>
  
    <div class="field">
      <input type="password" formControlName="confirmPassword" placeholder="Passwort wiederholen" />
      <div *ngIf="forgetPassForm.hasError('passwordMismatch')" class="error text-danger">
        Passwörter stimmen nicht überein.
      </div>
    </div>
  
    <div class="field">
      <button type="submit" [disabled]="forgetPassForm.invalid">Passwort zurücksetzen</button>
    </div>
  </form>
</div>
</div>
