<div class="bread-crumb-bar">
    <div class="container">
        <div class="row align-items-center inner-banner">
            <div class="col-md-12 col-12 text-center">
                <div class="breadcrumb-list">
                    <nav aria-label="breadcrumb" class="page-breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="index.html"><img src="assets/img/home-icon.svg"
                                        alt="Post Author"> Home</a></li>
                            <li class="breadcrumb-item" aria-current="page"><a routerLink="/ourProducts">Our
                                    Products</a></li>
                            <li class="breadcrumb-item" aria-current="page">Product Details</li>
                            <li class="breadcrumb-item" aria-current="page">{{ product.product_name }}</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<br><br>

<div class="container">
    <div class="row">
        <div class="col-md-6 col-lg-4 pb-5">
            <div class="product_card text-center shadow justify-content-between">
                <div class="product_img">
                    <img [src]="fileUrl + product.product_img" alt="author" class="img-fluid">
                </div><br>
                <div class="product_info">
                    <div class="product_name d-flex justify-content-between">
                        <div>
                            <p>{{ product.product_name }}</p>
                        </div>
                        <div>
                            <p>€{{ product.price }}</p>
                        </div>
                    </div>
                    <div class="about_product">
                        <p class="text-start" *ngIf="product.weight">
                            <img src="../../assets/img/icon/weight.png" alt="" class="img-fluid" width="30">
                            {{ product.weight }}
                        </p>
                        <p class="text-start" *ngIf="product.desc">
                            <img src="../../assets/img/icon/information.png" alt="" class="img-fluid" width="30">
                            {{ product.desc }}
                        </p>
                        <p class="text-start" *ngIf="product.incredients">
                            <img src="../../assets/img/icon/incredients.png" alt="" class="img-fluid" width="30">
                            {{ product.ingredients }}
                        </p>
                    </div>
                    <div class="cart-hover">
                        <a class="add_cart btn btn-warning bg-warning w-100" (click)="moveToCart(product.id)">In den
                            Warenkorb <i class="fa-solid fa-cart-shopping"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-8">
            <app-shop-card></app-shop-card>
        </div>
    </div>
</div>

<app-footer></app-footer>
