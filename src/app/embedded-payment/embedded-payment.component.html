<div class="main-wrapper">
    <div class="bread-crumb-bar">
        <div class="container">
           <ul class="breadcrumb">
               <li><a href="/">Home</a></li>
               <li><a href="/embedded-payment">Embedded Payment</a></li>
           </ul>
        </div>
    </div>
<div class="payment-iframe-container">
  <iframe
    *ngIf="safePaymentUrl"
    [src]="safePaymentUrl"
    width="100%"
    height="700"
    frameborder="0"
    allowfullscreen
    style="border-radius: 12px; border: 1px solid #ccc;"
  ></iframe>
  <div *ngIf="!safePaymentUrl" class="error-message">
    Keine Zahlungs-URL gefunden.
  </div>
</div>
</div>
