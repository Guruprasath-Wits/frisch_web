<style>
    .acard {
        text-align: center;
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
        width: 250px;
        height: 40px;
        margin-top: 20px;
    }

    .acard p {
        text-align: center;
        color: black;
        /* font-family: "Poppins", sans-serif; */
        font-weight: 600;
        padding-top: 10px;
        letter-spacing: 1.5px;
        font-size: 20px;
    }

    .acard:hover {
        transform: translateY(-5px);
        background-color: #e4a484;

    }

    .cus-h1 {
        color: #954535;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 1px;
    }

    .cus-h2 {
        color: #954535;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 1px;
    }

    .cus-img {
        width: 600px;
        height: 500px;
        margin-top: -80px;
        margin-left: 40px;
    }

    @media(max-width:426px) {
        .cus-img {
            display: none;
        }
    }

    @media(min-width:427px) and (max-width:770px) {
        .cus-img {
            display: none;
        }

        .static-card {
            margin-left: 175px;
        }

        .area-con {
            background-image: url('../../assets/img/dortmund.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    }
</style>


<div class="bread-crumb-bar">
    <div class="container">
       
    </div>
</div>

<section class="content ">
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-6 col-md-6 col-sm-12">
                <img class="img-fluid" src="../../assets/img/delivery_area1.png" alt="">
            </div>

            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="col-md-12 col-sm-12 col-xl-12 text-center text-dark cus-h1">
                    <h1 class="cus-h1">Postleitzahlen</h1>
                    <p class="cus-h2">(Unten sehen Sie die Postleitzahlen, in die wir liefern)</p>
                </div>

                <div class="d-flex flex-row flex-wrap delivery_area">
                    <div class="col-12 col-lg-6 col-md-6" *ngFor="let postcode of postcodes; let i = index">
                        <div class="faq-card">
                            <div class="faq-question">
                                <i class="fa-solid fa-location-dot fa-flip fa-lg text-danger"></i> {{ postcode.zipcode }}</div>
                            <div class="faq-answer">{{ postcode.area_name }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</section>


<app-footer></app-footer>
