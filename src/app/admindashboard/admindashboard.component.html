
<div class="content" *ngIf="content">
    <div class="container">
    <div class="row">
    <div class="col-md-6 offset-md-3">
    
    <div class="account-content">
    <div class="align-items-center justify-content-center">
    <div class="login-right">
    <div class="login-header text-center">
    <a ><img src="assets/img/logo-01.png" alt="logo" class="img-fluid"></a>
    <br>
    <h3>Admin</h3>
    </div>
    <form [formGroup]="userform">
    <div class="form-group form-focus">
    <input formControlName="email" type="text" class="form-control floating">
    <label class="focus-label">Email</label>
    </div>
    <div class="form-group form-focus">
    <input formControlName="hash" type="password" class="form-control floating">
    <label class="focus-label">Password</label>
    </div>
    <div class="form-group">
    <label class="custom_check">
    </label>
    </div>
    <button class="btn btn-primary btn-block btn-lg login-btn" (click)="submit()">Login</button>
    <div class="login-or">
    
    </div>
    <div class="row social-login">
    
    </div>
    <div class="row">
    <div class="col-6 text-start">
    <!-- <a class="forgot-link" href="forgot-password.html">Forgot Password ?</a> -->
    </div>
    </div>
    </form>
    </div>
    </div>
    </div>
    
    </div>
    </div>
    </div>
    </div>
<br><br><br><br><br><br>

  <div class="container"  *ngIf="!content">
    <div class="row">
      <div class="col-sm-6">
      </div>
      <div class="col-sm-4">
      </div>
      <div class="col-sm-2">
        <!-- <a  (click)="openDialog('0ms', '0ms')"   class="btn btn-primary">Add a Job</a> -->
        <button mat-raised-button id="show-projects-button" class="btn btn-primary" (click)="openModal()">Add a Job</button>
        
      </div>
    </div><br>
    <div class="row">
        <div class="col-md-4" *ngFor="let i of DATAS">
          <div class="card">
            <img class="card-img-top" src="http://localhost:9906/api/job/uploads/products/{{i.logo}}" alt="Card image cap" style="width: auto;height: 350px;">
            <div class="card-body">
              <h5 class="card-title">{{i.company_name}} </h5>
              <p class="card-text">{{i.description}}.</p>
              <a  class="btn btn-info" (click)="editModal(i)">Edit</a>&nbsp;
              <a  class="btn btn-danger" (click)="del(i._id)">Delete</a>
            </div>
            <mat-accordion>
              <mat-expansion-panel>
            <mat-expansion-panel-header>
              <mat-panel-title>
             Applied Details
              </mat-panel-title> 
            </mat-expansion-panel-header>
            <p>I'm visible because I am open</p>
          </mat-expansion-panel>
        </mat-accordion>
          </div>
        </div>
    </div>
  </div>
